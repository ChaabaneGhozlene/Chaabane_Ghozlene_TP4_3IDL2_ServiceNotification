server:
  port: 8084

spring:
  application:
    name: notification-service
  main:
    web-application-type: servlet

  data:
    mongodb:
      uri: mongodb://mongodb:27017/notification_db
      database: notification_db
      # Si vous voulez utiliser l'authentification plus tard :
      # uri: mongodb://admin:admin@mongodb:27017/notification_db?authSource=admin

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

logging:
  level:
    root: INFO
    com.example.demo: DEBUG
    org.springframework.amqp: DEBUG